name: Tatsumaki AI Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extract Project Zip
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.zip" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::File zip tidak ditemukan di root repo"
            exit 1
          fi
          echo "Mengekstrak: $ZIP"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/project"

      - name: Locate Gradle Project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" -name settings.gradle | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle tidak ditemukan setelah extract"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Configure Existing Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --list_installed

      - name: Build Tatsumaki AI
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tatsumaki-AI-Debug-APK
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14
