
name: Tatsumaki AI Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil source code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Java JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Menyiapkan Gradle 8.4
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 4. Menyiapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 5. Menerima lisensi Android SDK
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      # 6. Menginstal paket SDK yang diperlukan
      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 7. Memeriksa konfigurasi SDK
      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          java -version
          gradle --version

      # 8. Build APK Tatsumaki AI
      - name: Build Tatsumaki AI
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 9. Mengunggah APK hasil build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tatsumaki-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
